<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register | CollegeWise</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<div class="auth-brand"><a class="brand" href="index.html">🎓 CollegeWise</a></div>
<div class="auth-shell">
  <div class="auth-info"><span class="eyebrow">GET STARTED</span><h1>Build your college shortlist smarter.</h1><p>Create your free account and get personalized college guidance based on your profile.</p><div class="mini-stat"><b>10K+</b><span>students guided</span></div></div>
  <div class="auth-card"><h2>Create account</h2><p class="muted">Fill in your details to get started.</p>
    <form id="registerForm">
      <div class="two-col"><div><label>Full Name</label><input id="regName" required placeholder="Your name"></div><div><label>Phone</label><input id="regPhone" placeholder="9876543210"></div></div>
      <label>Email</label><input type="email" id="regEmail" required placeholder="you@example.com">
      <label>Password</label><input type="password" id="regPassword" required minlength="6" placeholder="Minimum 6 characters">
      <label>Confirm Password</label><input type="password" id="regConfirm" required placeholder="Repeat password">
      <label>Account Type</label><select id="regRole"><option value="STUDENT">Student</option><option value="USER">User</option></select>
      <label class="check"><input type="checkbox" required> I agree to the terms and privacy policy.</label>
      <button class="btn btn-primary full" type="submit">Create Account</button>
    </form><p class="center">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>
<script src="js/app.js"></script></body></html>
