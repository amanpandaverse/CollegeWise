<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f51e8"/>
      <stop offset="100%" stop-color="#7678f7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#141836" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded card -->
  <rect width="64" height="64" rx="16" fill="url(#grad)"/>
  
  <!-- Academic Cap / Mortarboard with subtle drop shadow -->
  <g filter="url(#shadow)">
    <!-- Cap Top Rhombus -->
    <polygon points="32,15 54,26 32,37 10,26" fill="#ffffff"/>
    
    <!-- Cap Skull/Base Underneath -->
    <path d="M19,31.5 V39.5 C19,45.5 45,45.5 45,39.5 V31.5 C39,34.5 25,34.5 19,31.5 Z" fill="#e0e3fc"/>
    
    <!-- Button on Cap -->
    <circle cx="32" cy="26" r="2.2" fill="url(#gold)"/>
    
    <!-- Tassel String and End -->
    <path d="M32,26 Q42,28 47,38" stroke="url(#gold)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="47" cy="39" r="2.5" fill="url(#gold)"/>
  </g>
  
  <!-- Smart Wisdom Sparkle in Top-Right -->
  <path d="M51,9 L52.2,12.5 L55.7,13.7 L52.2,14.9 L51,18.4 L49.8,14.9 L46.3,13.7 L49.8,12.5 Z" fill="url(#gold)"/>
</svg>
